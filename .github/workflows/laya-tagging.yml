name: Laya tagging

# Reads new posts with Laya (free, CPU) and writes the answers back to Supabase.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

concurrency:
  group: laya-tagging
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      LAYA_WORKER_TOKEN: ${{ secrets.LAYA_WORKER_TOKEN }}
      MAX_MINUTES: "40"
      TORCH_DISABLE_NATIVE_JIT: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Cache Laya model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-models-v1

      - name: Install Laya (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r worker/requirements.txt

      - name: Tag posts and accounts
        run: python worker/laya_worker.py
